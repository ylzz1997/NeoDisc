[package]
name = "lucent-cd"
version = "0.1.1"
description = "A thoughtful home for your CDs"
edition = "2021"
default-run = "lucent-cd"

[lib]
name = "lucent_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rodio = { version = "0.21.1", default-features = false, features = ["playback"] }
flacenc = { version = "0.5.1", default-features = false }
hound = "3.5"
sha2 = "0.10"
md-5 = "0.10"
dirs = "6"
sha1 = "0.10"
base64 = "0.22"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "native-tls", "system-proxy"] }
plist = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
quick-xml = { version = "0.42", features = ["serialize"] }

[dev-dependencies]
claxon = "0.4"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package.flacenc]
opt-level = 3
